buildscript {
	repositories {
		jcenter {
			url "http://jcenter.bintray.com/"
		}
	}

	dependencies {
		classpath 'com.android.tools.build:gradle:::::if (1 == 1)::ANDROID_GRADLE_PLUGIN::end::::'
	}
}

apply plugin: 'com.android.library'

android {
	def manifestFile = project.file('AndroidManifest.xml')
	if (manifestFile.exists()) {
		def manifestPackage = new groovy.xml.XmlSlurper(false, false)
			.parse(manifestFile)
			.attributes()['package']
			?.toString()

		if (manifestPackage) {
			namespace manifestPackage
			// if this line complains, try: namespace = manifestPackage
		}
	}

	compileSdkVersion Integer.parseInt(project.ANDROID_BUILD_SDK_VERSION)
	buildToolsVersion project.ANDROID_BUILD_TOOLS_VERSION
}

dependencies {
	compile project(':deps:extension-api')
}
